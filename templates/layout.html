<!doctype html>
<html>
	<head>
		<!-- 🖕 -->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			body {
				background: repeating-conic-gradient(from 0deg at 50% 150%, #ffffff 5%, #ffee99 10%, #ffffff 15%);
				background-attachment: fixed;
				margin: 40px auto;
				max-width: 90%;
				font-family: sans-serif;
			}
			.error-message {
				color: #ff0000;
				font-weight: bold;
			}
			.error-message-top {
				color: #ff0000;
				font-weight: bold;
			}

			pre {
				white-space: pre-wrap;
			}

			.raffle-image {
				min-width: 5px;
				min-height: 5px;
				max-width: 80%;
			}

			@media screen and (min-width: 50rem) {
				body {
					max-width: 70%;
				}
				.raffle-image {
					max-width: 65%;
				}
			}
			@media screen and (min-width: 100rem) {
				body {
					max-width: 60%;
				}
				.raffle-image {
					max-width: 50%;
				}
			}
			@media screen and (min-width: 25rem) {
				.wrapper { display: flex; }
				.flex1 {
					display: flex;
					flex: 1;
				} }
			}
			.wrapper-wvcenter {
				display: inline-flex;
				align-items: center;
			}
			.div-limit-height { height: 100%; }
			.nomargin { margin: 0px; }

			a { color: #554f33; }
			a:focus, a:hover, a:active { color: #7f774c; }
			.site-title-link {
				text-decoration-line: none;
				font-weight: bold;
			}
			.copyright-text {
				color: #666666;
				font-size: 75%;
			}
		</style>
		<title>{% block title %}{% endblock %} - esun Sate</title>
	</head>
	<body>
		<div class="wrapper">
			<div class="div-limit-height">
				<span class="wrapper-wvcenter"><a href="/" class="site-title-link"><span><img src="/favicon.ico" height="20"/></span> <span>esun Sate</span></a></span>
				| <span class="wrapper-wvcenter"><a href="/maniala" class="site-title-link"><span>🎁 alasa pi mani ala</span></a></span>
			</div>
		</div>
		<p>{% block content %}{% endblock %}</p>
		<p class="copyright-text">esun Sate li pali pi <a href="https://sadale.net/tok" target="_blank">jan Sate</a>.</p>
	</body>
</html>
